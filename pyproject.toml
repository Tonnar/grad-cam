[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradcam-pets"
version = "0.1.0"
description = "Grad-CAM explanations, with a saliency sanity check, for a transfer-learning pet-breed classifier"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tonnar Castellano" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gradcam = "gradcam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]
